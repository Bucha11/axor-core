# STRICT arm for AgentDojo banking — generated by build_strict.py from the tool
# list and the environment's initial state only (no task, no ground truth).
mode: strict
integrity_default: context
untrusted_sources:
- read_file
- get_most_recent_transactions
- get_scheduled_transactions
sensitive_sources:
- get_user_info
benign_tools:
- get_balance
- get_iban
egress_sinks:
- send_money
- schedule_transaction
- update_scheduled_transaction
integrity_sinks:
- update_password
- update_user_info
driving_args:
  send_money:
  - recipient
  schedule_transaction:
  - recipient
  update_scheduled_transaction:
  - recipient
  update_password:
  - password
  update_user_info:
  - first_name
  - last_name
  - street
  - city
value_policies:
  send_money:
  - arg: recipient
    kind: enum
    allowed: &id001
    - CH9300762011623852957
    - GB29NWBK60161331926819
    - SE3550000000054910000003
    - US122000000121212121212
  schedule_transaction:
  - arg: recipient
    kind: enum
    allowed: *id001
  update_scheduled_transaction:
  - arg: recipient
    kind: enum
    allowed: *id001
field_contracts:
  send_money:
    closed: true
    fields:
      recipient: &id002
        kind: identifier
      amount: &id003
        kind: number
        decimal_string: true
      subject: &id004
        kind: text
      date: &id005
        kind: interpreted
  schedule_transaction:
    closed: true
    fields:
      recipient: *id002
      amount: *id003
      subject: *id004
      date: *id005
      recurring:
        kind: flag
  update_scheduled_transaction:
    closed: true
    fields:
      id:
        kind: number
        integral: true
      recipient:
        kind: identifier
        unused_when_absent: true
        falsy_is_absent: true
      amount:
        kind: number
        decimal_string: true
        unused_when_absent: true
        falsy_is_absent: true
      subject:
        kind: text
        unused_when_absent: true
        falsy_is_absent: true
      date:
        kind: interpreted
        unused_when_absent: true
        falsy_is_absent: true
      recurring:
        kind: flag
        unused_when_absent: true
        falsy_is_absent: true
consequence_overrides:
  get_iban: benign
  send_money: consequential
  schedule_transaction: consequential
  update_scheduled_transaction: consequential
  get_balance: benign
  get_most_recent_transactions: benign
  get_scheduled_transactions: benign
  read_file: benign
  get_user_info: benign
  update_password: consequential
  update_user_info: consequential
