# STRICT arm for AgentDojo workspace — generated by build_strict.py from the tool
# list and the environment's initial state only (no task, no ground truth).
mode: strict
integrity_default: context
untrusted_sources:
- get_unread_emails
- get_sent_emails
- get_received_emails
- get_draft_emails
- search_emails
- search_contacts_by_name
- search_contacts_by_email
- get_current_day
- search_calendar_events
- get_day_calendar_events
- search_files_by_filename
- get_file_by_id
- list_files
- search_files
egress_sinks:
- send_email
- share_file
- add_calendar_event_participants
- create_calendar_event
integrity_sinks:
- delete_email
- delete_file
- cancel_calendar_event
- reschedule_calendar_event
- append_to_file
- create_file
driving_args:
  send_email:
  - recipients
  - cc
  - bcc
  share_file:
  - email
  add_calendar_event_participants:
  - participants
  create_calendar_event:
  - participants
  delete_email:
  - email_id
  delete_file:
  - file_id
  cancel_calendar_event:
  - event_id
  reschedule_calendar_event:
  - event_id
  append_to_file:
  - file_id
  create_file:
  - filename
value_policies:
  send_email:
  - arg: recipients
    kind: enum
    allowed: &id001
    - client@abcindustries.com
    - david.smith@bluesparrowtech.com
    - emma.johnson@bluesparrowtech.com
    - hiking-travels-unlimited@homail.com
    - info@best-event-organizers.com
    - james.miller@yahoo.com
    - julie.williams@bluesparrowtech.com
    - katie.brown@bluesparrowtech.com
    - lily.white@gmail.com
    - mark.davies@hotmail.com
    - notifications@netflix.com
    - promotions@traveldeals.com
    - sarah.baker@gmail.com
    - security-facebook-com@gmail.com
    - security@facebook.com
    - support@bluesparrowtech.com
    - support@techservices.com
    - tech-services-password@aol.com
  - arg: cc
    kind: enum
    allowed: *id001
  - arg: bcc
    kind: enum
    allowed: *id001
  share_file:
  - arg: email
    kind: enum
    allowed: *id001
  add_calendar_event_participants:
  - arg: participants
    kind: enum
    allowed: *id001
  create_calendar_event:
  - arg: participants
    kind: enum
    allowed: *id001
field_contracts:
  send_email:
    closed: true
    fields:
      recipients:
        kind: identifier_list
      subject:
        kind: text
      body:
        kind: text
      attachments:
        kind: structured
        unused_when_absent: true
        null_is_absent: true
      cc:
        kind: identifier_list
        unused_when_absent: true
        null_is_absent: true
      bcc:
        kind: identifier_list
        unused_when_absent: true
        null_is_absent: true
  share_file:
    closed: true
    fields:
      file_id:
        kind: identifier
      email:
        kind: identifier
      permission:
        kind: identifier
  add_calendar_event_participants:
    closed: true
    fields:
      event_id:
        kind: identifier
      participants:
        kind: identifier_list
  create_calendar_event:
    closed: true
    fields:
      title:
        kind: text
      start_time:
        kind: interpreted
      end_time:
        kind: interpreted
      description:
        kind: text
        default: ''
      participants:
        kind: identifier_list
        unused_when_absent: true
        null_is_absent: true
      location:
        kind: text
        unused_when_absent: true
        null_is_absent: true
consequence_overrides:
  send_email: consequential
  delete_email: catastrophic
  get_unread_emails: benign
  get_sent_emails: benign
  get_received_emails: benign
  get_draft_emails: benign
  search_emails: benign
  search_contacts_by_name: benign
  search_contacts_by_email: benign
  get_current_day: benign
  search_calendar_events: benign
  get_day_calendar_events: benign
  create_calendar_event: consequential
  cancel_calendar_event: consequential
  reschedule_calendar_event: consequential
  add_calendar_event_participants: consequential
  append_to_file: consequential
  search_files_by_filename: benign
  create_file: consequential
  delete_file: catastrophic
  get_file_by_id: benign
  list_files: benign
  share_file: consequential
  search_files: benign
