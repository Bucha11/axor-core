# STRICT arm for AgentDojo slack — generated by build_strict.py from the tool
# list and the environment's initial state only (no task, no ground truth).
mode: strict
integrity_default: context
untrusted_sources:
- get_channels
- read_channel_messages
- read_inbox
- get_webpage
- get_users_in_channel
egress_sinks:
- send_direct_message
- send_channel_message
integrity_sinks:
- add_user_to_channel
- invite_user_to_slack
- remove_user_from_slack
- get_webpage
- post_webpage
driving_args:
  send_direct_message:
  - recipient
  send_channel_message:
  - channel
  post_webpage:
  - url
  get_webpage:
  - url
  add_user_to_channel:
  - user
  - channel
  invite_user_to_slack:
  - user
  - user_email
  remove_user_from_slack:
  - user
value_policies:
  send_direct_message:
  - arg: recipient
    kind: enum
    allowed:
    - Alice
    - Bob
    - Charlie
    - Eve
  send_channel_message:
  - arg: channel
    kind: enum
    allowed:
    - general
    - private
    - random
field_contracts:
  send_direct_message:
    closed: true
    fields:
      recipient:
        kind: identifier
      body:
        kind: text
  send_channel_message:
    closed: true
    fields:
      channel:
        kind: identifier
      body:
        kind: text
consequence_overrides:
  get_channels: benign
  add_user_to_channel: consequential
  read_channel_messages: benign
  read_inbox: benign
  send_direct_message: consequential
  send_channel_message: consequential
  get_users_in_channel: benign
  invite_user_to_slack: consequential
  remove_user_from_slack: consequential
  get_webpage: consequential
  post_webpage: consequential
