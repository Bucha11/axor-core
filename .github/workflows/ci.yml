name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          pip install -e ".[dev]"

      - name: Static analysis — no provider imports in core
        run: |
          python - << 'EOF'
          import ast, os, sys
          issues = []
          for root, dirs, files in os.walk("axor_core"):
              dirs[:] = [d for d in dirs if not d.startswith("__")]
              for f in files:
                  if not f.endswith(".py"):
                      continue
                  path = os.path.join(root, f)
                  src  = open(path).read()
                  for provider in ["anthropic", "openai", "langchain", "boto3"]:
                      if f"import {provider}" in src or f"from {provider}" in src:
                          issues.append(f"PROVIDER_IMPORT: {path} imports {provider}")
          if issues:
              print("\n".join(issues))
              sys.exit(1)
          print(f"✓ no provider imports in axor_core/")
          EOF

      - name: Docs reference check — no drift to nonexistent modules
        run: python tools/check_docs.py

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run example artifacts (degradation corpus)
        run: pytest examples/ -q

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi

    permissions:
      id-token: write   # for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          python - << 'EOF'
          import pathlib
          import re
          import sys
          import tomllib

          ref = "${{ github.ref_name }}"
          m = re.fullmatch(r"v(\d+\.\d+\.\d+)", ref)
          if not m:
              print(f"Tag {ref!r} must match vX.Y.Z")
              sys.exit(1)

          tag_version = m.group(1)
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          pkg_version = data["project"]["version"]

          if tag_version != pkg_version:
              print(f"Version mismatch: tag={tag_version}, pyproject={pkg_version}")
              sys.exit(1)

          print(f"Version check passed: {pkg_version}")
          EOF

      - name: Build
        run: |
          pip install hatchling build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Trigger downstream rebuilds
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"   # strip leading "v" so pip can use it directly
          PAYLOAD="{\"event_type\":\"axor-core-published\",\"client_payload\":{\"version\":\"${VERSION}\"}}"
          for REPO in \
            Bucha11/axor-sentinel \
            Bucha11/axor-claude \
            Bucha11/axor-cli \
            Bucha11/axor-daemon \
            Bucha11/axor-langchain \
            Bucha11/axor-memory-sqlite \
            Bucha11/axor-telemetry \
            Bucha11/axor-benchmarks \
            Bucha11/axor-classifier-simple \
            Bucha11/axor-classifier-llm; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.CROSS_REPO_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/dispatches" \
              -d "${PAYLOAD}")
            echo "→ ${REPO}: HTTP ${STATUS}"
            if [ "${STATUS}" != "204" ]; then
              echo "Warning: dispatch to ${REPO} returned ${STATUS} (non-fatal)"
            fi
          done
